<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOD STORE</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#090909;color:white;
font-family:Arial,sans-serif;text-align:center
}
header{
background:linear-gradient(135deg,#e60000,#650000);
padding:30px 15px
}
header h1{font-size:34px;margin:0}
header p{color:#eee}
.container{max-width:850px;margin:auto;padding:18px}
h2{color:#ff3030}
.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:14px
}
.card{
background:#191919;
border:1px solid #a90000;
border-radius:14px;
padding:20px 10px;
cursor:pointer;
transition:.2s
}
.card:hover{background:#303030;transform:scale(1.03)}
.icon{font-size:42px}
.card h3{margin:10px 0}
.panel{
background:#191919;
border-radius:14px;
padding:20px;
margin-top:25px;
border:1px solid #e60000
}
input,select{
width:100%;padding:13px;margin:8px 0;
border:0;border-radius:8px;font-size:16px
}
button{
background:#e60000;color:white;border:0;
padding:13px 20px;border-radius:8px;
font-size:17px;cursor:pointer;margin:5px
}
button:hover{background:#a00000}
#selected{color:#ff5555;font-size:20px}
footer{background:#181818;padding:20px;margin-top:35px;color:#aaa}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>🔥 ABOD STORE</h1>
<p>متجرك الأول لشحن الألعاب والخدمات الرقمية</p>
</header>

<div class="container">

<h2>🎮 اختر لعبتك</h2>

<div class="games">

<div class="card" onclick="choose('Free Fire')">
<div class="icon">🔥</div>
<h3>Free Fire</h3>
<p>شحن جواهر</p>
</div>

<div class="card" onclick="choose('PUBG Mobile')">
<div class="icon">🎯</div>
<h3>PUBG Mobile</h3>
<p>شحن شدات</p>
</div>

<div class="card" onclick="choose('Roblox')">
<div class="icon">🟦</div>
<h3>Roblox</h3>
<p>Robux</p>
</div>

<div class="card" onclick="choose('Mobile Legends')">
<div class="icon">⚔️</div>
<h3>Mobile Legends</h3>
<p>شحن ماسات</p>
</div>

<div class="card" onclick="choose('Call of Duty Mobile')">
<div class="icon">🎮</div>
<h3>Call of Duty</h3>
<p>شحن CP</p>
</div>

<div class="card" onclick="choose('eFootball')">
<div class="icon">⚽</div>
<h3>eFootball</h3>
<p>كوينز</p>
</div>

<div class="card" onclick="choose('Clash of Clans')">
<div class="icon">🏰</div>
<h3>Clash of Clans</h3>
<p>جواهر</p>
</div>

<div class="card" onclick="choose('Clash Royale')">
<div class="icon">💎</div>
<h3>Clash Royale</h3>
<p>جواهر</p>
</div>

</div>

<div class="panel hidden" id="order">

<h2>🛒 إنشاء طلب</h2>

<p id="selected"></p>

<input id="player" placeholder="أدخل ID اللاعب">

<select id="package">
<option value="">اخ
