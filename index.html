<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOD STORE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    text-align: center;
}

header {
    background: #e60000;
    padding: 25px;
}

header h1 {
    font-size: 35px;
    margin: 0;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

h2 {
    color: #ff3030;
}

.game {
    background: #222;
    margin: 18px 0;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid red;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    background: #e60000;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

footer {
    background: #222;
    padding: 20px;
    margin-top: 30px;
    color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>🔥 ABOD STORE</h1>
<p>متجرك الأول لشحن الألعاب والخدمات الرقمية</p>
</header>

<div class="container">

<h2>🎮 اطلب شحنتك الآن</h2>

<div class="game">

<form onsubmit="sendOrder(event)">

<select id="game" required>
<option value="">اختر اللعبة</option>
<option>Free Fire</option>
<option>PUBG Mobile</option>
<option>Roblox</option>
<option>Mobile Legends</option>
</select>

<input type="text" id="player" placeholder="أدخل ID اللاعب" required>

<select id="package" required>
<option value="">اختر باقة الشحن</option>
<option>باقة صغيرة</option>
<option>باقة متوسطة</option>
<option>باقة كبيرة</option>
<option>باقة أخرى</option>
</select>

<input type="text" id="customer" placeholder="اسمك" required>

<button type="submit">إرسال الطلب عبر واتساب</button>

</form>

</div>
</div>

<footer>
<p>© 2026 ABOD STORE</p>
<p>جميع الحقوق محفوظة</p>
</footer>

<script>
function sendOrder(event) {
    event.preventDefault();

    const game = document.getElementById("game").value;
    const player = document.getElementById("player").value;
    const pack = document.getElementById("package").value;
    const customer = document.getElementById("customer").value;

    const message =
        "طلب جديد من ABOD STORE 🔥\n\n" +
        "اللعبة: " + game + "\n" +
        "ID اللاعب: " + player + "\n" +
        "باقة الشحن: " + pack + "\n" +
        "اسم الزبون: " + customer;

    const phone = "963935310973";

    const url = "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}
</script>

</body>
</html>
